REQ-017: {must_ask: false, required_kpis: [], allowed_kpis: [], must_touch: [], required_properties: [[language, locale, new_language, to_language]]}
REQ-018: {must_ask: true, required_kpis: [], allowed_kpis: [newsletter_signup_rate, add_to_cart_rate], must_touch: [], required_properties: []}
REQ-019: {must_ask: false, required_kpis: [], allowed_kpis: [add_to_cart_rate], must_touch: [], required_properties: [[product_ids]]}
